services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: rag_pgvector
    restart: unless-stopped
    environment:
      POSTGRES_USER: rag_user
      POSTGRES_PASSWORD: rag_password
      POSTGRES_DB: enterprise_rag
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./scripts/init.sql:/docker-entrypoint-initdb.d/init.sql

volumes:
  pgdata:

# I used pgvector instead of Pinecone or Qdrant. Because I want to be keeping vectors
# inside PostgreSQL. It gives ACID transactions and strict SQL-level RBAC filtering in single query.
