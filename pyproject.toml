[project]
name = "enterprise-rag-eval"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "samandareo", email = "smdeveloper04@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.163.1",
    "openai>=3.51.0",
    "pgvector>=0.5.1",
    "psycopg[binary]>=3.3.9",
    "pydantic>=2.14.3",
    "pydantic-settings>=2.16.3",
    "pymupdf4llm>=2.1",
    "python-docx>=1.2.0",
    "python-dotenv>=1.2.4",
    "rank-bm25>=0.2.2",
    "uvicorn>=0.54.0",
]

[project.scripts]
enterprise-rag-eval = "enterprise_rag_eval:main"

[build-system]
requires = ["uv_build>=0.13.8,<0.14.0"]
build-backend = "uv_build"
